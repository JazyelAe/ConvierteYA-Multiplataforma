# En cada push: pruebas (jest) y la versión web en GitHub Pages, generada con el MISMO código que el APK.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  probar-y-construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pruebas de conversión (jest)
        run: npm test
      - name: Exportar la versión web (react-native-web)
        run: npx expo export -p web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: probar-y-construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - id: publicar
        uses: actions/deploy-pages@v4
